name: Build Nyra for macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npm run build:mac -- --universal --publish never

      - name: Verify macOS app signature
        run: |
          APP=$(find dist -maxdepth 2 -name 'Nyra.app' -type d -print -quit)
          test -n "$APP"
          codesign --verify --deep --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1
          lipo -info "$APP/Contents/MacOS/Nyra" | grep -E 'x86_64|arm64'

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Nyra-macOS
          path: |
            dist/*.dmg
            dist/*.zip
