name: Build Nyra for macOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        run: npm run build:mac -- --universal --dir --publish never

      - name: Verify ad-hoc signature
        run: |
          APP=$(find dist -name 'Nyra.app' -type d -print -quit)
          echo "Found app at: $APP"
          test -n "$APP"
          codesign --verify --deep --verbose=2 "$APP"
          echo "App is signed successfully"

      - name: Create DMG
        run: |
          APP=$(find dist -name 'Nyra.app' -type d -print -quit)
          hdiutil create -volname "Nyra" -srcfolder "$APP" -ov -format UDZO "dist/Nyra.dmg"

      - name: Create ZIP
        run: |
          APP=$(find dist -name 'Nyra.app' -type d -print -quit)
          APP_DIR=$(dirname "$APP")
          cd "$APP_DIR" && zip -ry "../../dist/Nyra.zip" "Nyra.app"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Nyra-macOS
          path: |
            dist/*.dmg
            dist/*.zip
