name: Release Nyra

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Windows installer
        run: npm run build:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

  macos:
    needs: windows
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish universal Mac package
        run: npm run build:mac -- --universal --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
